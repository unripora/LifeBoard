[versions]
agp = "8.12.3"
kotlin = "2.3.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
# Vico 3.2.3 依赖 Compose Multiplatform 1.9.0（Android 侧重定向到 AndroidX Compose）。
# Kotlin 2.3.21 要求 AGP ≥8.12，故同步升 AGP。
# BOM 保持 2024.12.01：Android 侧的 Compose 版本由 CMP 1.12.2 统一约束，
# 显式 BOM 只用于给未参与 CMP 对齐的 androidx 组件（activity/lifecycle）兜底，
# 抬高它会与 CMP 的传递版本打架，且 1.12.1 之后的 compose 要求 compileSdk 37。
composeBom = "2024.12.01"
# 图标集是独立发布的，不受 CMP 约束，得自己钉版本。
# 取与 BOM 2024.12.01 对齐的 1.7.6：再高就会连带要求更新的 compose runtime。
composeIcons = "1.7.6"
vico = "3.2.3"
work = "2.10.0"
coroutines = "1.9.0"
# LSPosed / libxposed API（实机 Vector v2.1.1，API 102）
# 发布在 JitPack，坐标版本为 102.0.0
libxposedApi = "102.0.0"
# Legacy Xposed API 桩（仅编译期，运行时由 LSPosed 注入）
# 实机已验证 AutoAccounting 用这套 API 可在 system_server 正常加载
legacyXposedApi = "82"
junit = "4.13.2"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
okhttp = "4.12.0"
# === 桌面端（M0 验证结论） ===
# Compose Multiplatform 稳定版。Vico 3.2.3 要求 compose 1.11.0，故不低于 1.11。
# 与本项目 Kotlin 2.3.21 的兼容性由 M0 子任务 0.1 实测确认。
composeMultiplatform = "1.12.2"
# SQLDelight 2.x：一套 .sq 双端生成，替代 Room（用户指定「一套 SQL」）
sqldelight = "2.4.1"
# JNA：桌面侧调用 quickjs-ng .dll 与 Windows DPAPI
jna = "5.19.1"
# 桌面 SQLite 驱动，固定版本避免随 JDK/系统漂移
sqliteJdbc = "3.54.1.0"
# kotlinx-serialization：一套 JSON 编解码放 commonMain。
# 不用 org.json —— 那是 Android 框架类，桌面端没有实现。
# 1.7.3 与缓存里已有的 core/bom 版本一致，避免被 BOM 提级后重新解析。
serialization = "1.7.3"
# Lifecycle 的 KMP 坐标版本。必须与 CMP 1.12.2 传递进来的
# lifecycle-runtime-compose 完全一致（2.9.6），否则同一张依赖图里会出现
# 两个 lifecycle-common，ViewModel 的 scope 与界面生命周期对不上。
composeLifecycle = "2.9.6"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 官方核心图标集（约 100KB，含 Filled/Outlined 常用图标）。
# 注意：不要换成 material-icons-extended（七千多个图标约 40MB，会把 APK 撑到 57MB，
# 见 docs/postmortem_lsposed_injection.md）。
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "composeIcons" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }

libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposedApi" }
legacy-xposed-api = { group = "de.robv.android.xposed", name = "api", version.ref = "legacyXposedApi" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# org.json 的官方 JVM 实现。Android 上 org.json 由框架提供，但 JVM 单测跑的是
# android.jar 里的 stub，调用会抛 "Stub!"——不引这个依赖，任何用 org.json 的
# 纯逻辑都无法做 JVM 单测。**只加 testImplementation，不进 APK。**
org-json = { group = "org.json", name = "json", version = "20240303" }

# 图表引擎：折线/柱状/面积原生，饼图实验性，散点用折线仅点实现。
# 雷达图官方不支持，本任务不做雷达。
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# === 桌面端依赖 ===
sqldelight-runtime = { group = "app.cash.sqldelight", name = "runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { group = "app.cash.sqldelight", name = "android-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { group = "app.cash.sqldelight", name = "sqlite-driver", version.ref = "sqldelight" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# Lifecycle 的 KMP 版本（org.jetbrains.androidx.lifecycle）。
# 版本必须与 CMP 1.12.2 传递进来的 lifecycle-runtime-compose 完全一致（2.9.6），
# 否则同一张图里会出现两个 lifecycle-common，ViewModel 的 scope 与界面生命周期对不上。
#
# **这里必须钉版本**：这些坐标不在 CMP 的对齐表里（不钉的话 version 是空字符串，
# 解析直接报 "Could not find ...:."），与上面那三个 androidx-lifecycle-* 不是一回事。
compose-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "composeLifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
